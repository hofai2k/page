
<!DOCTYPE html>
<html lang="zh-HK">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音訊與動態動態文本管理器</title>
    <style>
        :root {
            --bg-app: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;

            /* Action Colors */
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --success-hover: #059669;
            --danger: #ef4444;
            --danger-hover: #b91c1c;
            --utility: #f1f5f9;
            --utility-hover: #e2e8f0;

            /* Feedback States */
            --playing-border: #3b82f6;
            --playing-bg: #f0f7ff;
            --selected-border: #6366f1;
            --selected-shadow: rgba(99, 102, 241, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Microsoft JhengHei", sans-serif;
            background-color: var(--bg-app);
            color: var(--text-main);
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background-color 0.3s ease;
        }

        /* 專注/劇場模式背景 */
        body.focus-mode-active {
            background-color: #0f172a; /* 深色背景防止分心 */
            overflow: hidden; /* 防止滾動 */
        }

        .app-container {
            width: 100%;
            max-width: 1100px;
            transition: opacity 0.3s ease, filter 0.3s ease;
        }

        /* 當進入專注模式時，隱藏主容器內容 */
        body.focus-mode-active .app-container {
            opacity: 0.1;
            filter: blur(4px);
            pointer-events: none;
        }

        h2 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 24px;
            color: var(--text-main);
            letter-spacing: -0.025em;
        }

        /* 頂部工具列 */
        .controls-header {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            background: var(--bg-card);
            padding: 18px 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            margin-bottom: 32px;
            border: 1px solid var(--border-color);
        }

        .global-settings {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-main);
            background: #f8fafc;
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .global-settings label {
            color: var(--text-muted);
        }

        .global-settings input[type="number"] {
            width: 55px;
            padding: 6px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            text-align: center;
            font-weight: 600;
            color: var(--text-main);
            outline: none;
        }

        /* Combo Box Select styling */
        .global-voice-select {
            padding: 6px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background-color: #8b5cf6;
            color: white;
            font-size: 0.875rem;
            font-weight: 600;
            outline: none;
            cursor: pointer;
            max-width: 280px;
        }
        .global-voice-select option {
            background-color: white;
            color: var(--text-main);
        }

        /* 按鈕基礎樣式 */
        button {
            padding: 10px 16px;
            cursor: pointer;
            border-radius: 8px;
            border: none;
            font-size: 0.875rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s ease-in-out;
        }

        button:active {
            transform: scale(0.97);
        }

        /* 工具列按鈕顏色 */
        .add-btn {
            background-color: var(--success);
            color: white;
        }

        .add-btn:hover {
            background-color: var(--success-hover);
        }

        .add-wait-btn {
            background-color: #f59e0b;
            color: white;
        }

        .add-wait-btn:hover {
            background-color: #d97706;
        }

        .play-all-btn {
            background-color: var(--primary);
            color: white;
        }

        .play-all-btn:hover {
            background-color: var(--primary-hover);
        }

        .stop-all-btn {
            background-color: var(--danger);
            color: white;
        }

        .stop-all-btn:hover {
            background-color: var(--danger-hover);
        }

        .utility-btn {
            background-color: var(--utility);
            color: #334155;
        }

        .utility-btn:hover {
            background-color: var(--utility-hover);
        }

        .export-btn {
            background-color: #0ea5e9;
            color: white;
        }

        .export-btn:hover {
            background-color: #0284c7;
        }

        .import-btn {
            background-color: #64748b;
            color: white;
        }

        .import-btn:hover {
            background-color: #475569;
        }

        /* 卡片網格 */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
            width: 100%;
        }

        /* 卡片樣式 (固定大小) */
        .record-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-top: 6px solid var(--card-accent, #64748b);
            border-radius: 14px;
            padding: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 320px;
            height: 250px;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease, background-color 0.2s ease;
            position: relative;
            cursor: pointer;
        }

        /* 點選選取狀態 */
        .record-card.selected-card {
            border-color: var(--selected-border) !important;
            box-shadow: 0 0 0 3px var(--selected-shadow), 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transform: translateY(-2px);
        }

        /* 拖拽中的樣式狀態 */
        .record-card.dragging {
            opacity: 0.4;
            border: 2px dashed #94a3b8;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 24px;
            cursor: move;
            user-select: none;
            background: #f8fafc;
            padding: 4px 8px;
            margin: -16px -16px 12px -16px;
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
            border-bottom: 1px solid var(--border-color);
        }

        .card-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            font-weight: 700;
        }

        /* 密碼式文字框 */
        .input-wrapper {
            display: flex;
            gap: 8px;
            width: 100%;
            height: 110px;
            position: relative;
        }

        textarea {
            width: 100%;
            height: 100%;
            padding: 10px 36px 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-family: ui-monospace, monospace;
            font-size: 0.9rem;
            color: var(--text-main);
            background-color: #f8fafc;
            outline: none;
            resize: none;
            transition: all 0.2s ease;
        }

        textarea:focus {
            border-color: var(--card-accent, var(--primary));
            background-color: var(--bg-card);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.05);
        }

        textarea.masked-active {
            -webkit-text-security: disc;
            text-security: disc;
        }

        /* 雙按鈕浮動定位 (顯示/隱藏) */
        .toggle-btn {
            position: absolute;
            right: 8px;
            top: 8px;
            background-color: #f1f5f9;
            color: #475569;
            padding: 6px;
            border-radius: 6px;
            z-index: 2;
            width: 28px;
            height: 28px;
        }

        .toggle-btn:hover {
            background-color: #e2e2e0;
        }

        /* 等待卡片專屬內層樣式 */
        .wait-card-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            gap: 12px;
        }

        .wait-card-clock {
            font-size: 2.5rem;
            transition: font-size 0.3s ease;
        }

        .wait-input-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
        }

        .wait-input-group input {
            width: 70px;
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            text-align: center;
            font-size: 1.1rem;
            font-weight: 700;
        }

        /* 卡片底部操作鍵 */
        .card-actions {
            display: flex;
            gap: 4px;
            border-top: 1px solid var(--border-color);
            padding-top: 12px;
            height: 48px;
            align-items: center;
        }

        .card-actions button {
            flex: 1;
            padding: 8px 4px;
            font-size: 0.75rem;
            white-space: nowrap;
        }

        .record-btn {
            background-color: #fee2e2;
            color: #ef4444;
        }

        .record-btn:hover {
            background-color: #fca5a5;
        }

        .record-btn.recording {
            background-color: var(--danger);
            color: white;
            animation: blink 1.2s infinite;
        }

        .play-btn {
            background-color: var(--card-light-accent, #dbeafe);
            color: var(--card-accent, #2563eb);
        }

        .play-btn:hover:not(:disabled) {
            filter: brightness(0.93);
        }

        .play-btn:disabled {
            background-color: #f1f5f9;
            color: #cbd5e1;
            cursor: not-allowed;
        }

        /* 文字朗讀功能鍵樣式 */
        .tts-btn {
            background-color: #fef3c7;
            color: #d97706;
            flex: 1.5 !important; /* Make room for content */
        }

        .tts-btn:hover {
            background-color: #fde68a;
        }

        .delete-btn {
            background-color: transparent;
            color: #94a3b8;
            border-radius: 50%;
            padding: 4px;
            width: 24px;
            height: 24px;
        }

        .delete-btn:hover {
            color: var(--danger);
            background-color: #fee2e2;
        }

        #fileInput {
            display: none;
        }

        /* ==========================================
           劇場聚焦模式專屬樣式 (Focus Mode Overlay)
           ========================================== */
        .focus-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(15, 23, 42, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            gap: 40px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        body.focus-mode-active .focus-overlay {
            opacity: 1;
            pointer-events: auto;
        }

        /* 放大播放中卡片的包裝層 */
        .focus-card-slot {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 420px;
        }

        /* 強制放大卡片 */
        body.focus-mode-active .record-card.playing-now {
            width: 650px;
            height: 400px;
            cursor: default;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border-color: var(--playing-border) !important;
            background-color: var(--playing-bg);
            transform: none;
        }

        /* 放大卡片內的文字與字體大小 */
        body.focus-mode-active .record-card.playing-now textarea {
            font-size: 1.6rem;
            line-height: 1.5;
            padding: 20px;
        }

        body.focus-mode-active .record-card.playing-now .input-wrapper {
            height: 240px;
        }

        body.focus-mode-active .record-card.playing-now .wait-card-clock {
            font-size: 5rem;
        }

        body.focus-mode-active .record-card.playing-now .wait-input-group span,
        body.focus-mode-active .record-card.playing-now .wait-input-group input {
            font-size: 2rem;
        }

        body.focus-mode-active .record-card.playing-now .wait-input-group input {
            width: 120px;
        }

        /* 控制台按鈕放大 */
        .focus-controls {
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .focus-stop-btn {
            background-color: var(--danger);
            color: white;
            font-size: 1.5rem;
            padding: 16px 40px;
            border-radius: 50px;
            box-shadow: 0 10px 20px rgba(239, 68, 68, 0.3);
            font-weight: 700;
        }

        .focus-stop-btn:hover {
            background-color: var(--danger-hover);
            transform: scale(1.05);
        }

        @keyframes blink {
            50% {
                opacity: 0.6;
            }
        }
    </style>
</head>

<body>

    <div class="focus-overlay" id="focusOverlay">
        <div class="focus-card-slot" id="focusCardSlot">
            </div>
        <div class="focus-controls">
            <button type="button" class="focus-stop-btn" id="focusStopBtn">🛑 停止播放並退出</button>
        </div>
    </div>

    <div class="app-container">
        <h2>音訊與機密文字卡片管理系統</h2>

        <div class="controls-header">
            <button type="button" class="export-btn" id="exportBtn">📥 匯出 JSON 備份</button>
            <button type="button" class="import-btn" id="triggerImportBtn">📤 匯入 JSON 檔案</button>
            <input type="file" id="fileInput" accept=".json">
        </div>

        <div class="controls-header">
            <button type="button" class="add-btn" id="addFieldsBtn">➕ 新增文字卡片</button>
            <button type="button" class="add-wait-btn" id="addWait10Btn">⏳ 新增等待卡 (10秒)</button>
            <button type="button" class="add-wait-btn" id="addWait5Btn">⏳ 新增等待卡 (5秒)</button>
            <button type="button" class="utility-btn" id="showAllBtn">👁️ 顯示全部文字</button>
            <button type="button" class="utility-btn" id="hideAllBtn">🔒 隱藏全部文字</button>
        </div>

        <div class="controls-header">
            <button type="button" class="play-all-btn" id="playAllBtn">▶️ 順序播放全部</button>
            <button type="button" class="stop-all-btn" id="stopAllBtn">🛑 🛑 停止全部播放</button>

            <div class="global-settings">
                <label for="globalLoops">重複次數:</label>
                <input type="number" id="globalLoops" min="1" max="10" value="1">

                <label for="globalWait" style="margin-left: 5px;">播放間隔 (秒):</label>
                <input type="number" id="globalWait" min="0" max="30" value="0">

                <label for="globalVoiceSelect" style="margin-left: 5px;">🗣️ 朗讀語音:</label>
                <select id="globalVoiceSelect" class="global-voice-select">
                    <option value="">載入系統語音中...</option>
                </select>
            </div>
        </div>

        <div class="cards-grid" id="dynamicContainer"></div>
    </div>

    <script>
        const addFieldsBtn = document.getElementById('addFieldsBtn');
        const addWait10Btn = document.getElementById('addWait10Btn');
        const addWait5Btn = document.getElementById('addWait5Btn');
        const playAllBtn = document.getElementById('playAllBtn');
        const stopAllBtn = document.getElementById('stopAllBtn');
        const showAllBtn = document.getElementById('showAllBtn');
        const hideAllBtn = document.getElementById('hideAllBtn');
        const globalLoopsInput = document.getElementById('globalLoops');
        const globalWaitInput = document.getElementById('globalWait');
        const globalVoiceSelect = document.getElementById('globalVoiceSelect');
        const exportBtn = document.getElementById('exportBtn');
        const triggerImportBtn = document.getElementById('triggerImportBtn');
        const fileInput = document.getElementById('fileInput');
        const dynamicContainer = document.getElementById('dynamicContainer');

        // 聚焦模式 DOM
        const focusOverlay = document.getElementById('focusOverlay');
        const focusCardSlot = document.getElementById('focusCardSlot');
        const focusStopBtn = document.getElementById('focusStopBtn');

        let rowsData = [];
        let cardSequenceCounter = 0;
        let isGlobalPlaying = false; 
        let currentActiveAudio = null; 
        let currentWaitInterval = null; 
        let selectedCardId = null; 
        let lastFocusedCardElement = null; // 用於記錄最後一張停留在畫面的卡片
        
        // 用於存放系統語音陣列與當前選取的 Voice URI
        let systemVoices = [];
        let selectedVoiceUri = "";

        const pastelColors = [
            { main: '#6366f1', light: '#e0e7ff' },
            { main: '#3b82f6', light: '#dbeafe' },
            { main: '#a855f7', light: '#f3e8ff' },
            { main: '#ec4899', light: '#fce7f3' },
            { main: '#f97316', light: '#ffedd5' },
            { main: '#06b6d4', light: '#ecfeff' }
        ];

        const waitCardColor = { main: '#64748b', light: '#f1f5f9' };

        const generateId = () => '_' + Math.random().toString(36).substr(2, 9);

        initDragAndDrop();

        // 載入並填充系統內建的所有語音
        function loadSystemVoices() {
            if (typeof speechSynthesis === 'undefined') return;
            
            // 獲取系統原始語音並進行關鍵字過濾
            const allVoices = window.speechSynthesis.getVoices();
            systemVoices = allVoices.filter(voice => {
                const nameLower = voice.name.toLowerCase();
                const langLower = voice.lang.toLowerCase();
                return nameLower.includes('hk') || langLower.includes('hk') ||
                       nameLower.includes('tw') || langLower.includes('tw') ||
                       nameLower.includes('zh') || langLower.includes('zh') ||
                       nameLower.includes('cn') || langLower.includes('cn');
            });

            globalVoiceSelect.innerHTML = '';

            if (systemVoices.length === 0) {
                const opt = document.createElement('option');
                opt.value = "";
                opt.innerText = "未偵測到指定的中文/廣東話系統語音";
                globalVoiceSelect.appendChild(opt);
                return;
            }

            systemVoices.forEach(voice => {
                const option = document.createElement('option');
                option.value = voice.voiceURI;
                option.innerText = `${voice.name} (${voice.lang})`;
                
                // 預設優先選取廣東話（zh-HK）
                if (!selectedVoiceUri && (voice.lang === 'zh-HK' || voice.lang.includes('HK'))) {
                    option.selected = true;
                    selectedVoiceUri = voice.voiceURI;
                }
                globalVoiceSelect.appendChild(option);
            });

            // 如果沒撈到預設香港粵語，就直接選取過濾清單的第一個
            if (!selectedVoiceUri && globalVoiceSelect.options.length > 0) {
                globalVoiceSelect.options[0].selected = true;
                selectedVoiceUri = globalVoiceSelect.options[0].value;
            }
        }

        // 初始化語音監聽
        if (typeof speechSynthesis !== 'undefined') {
            loadSystemVoices();
            if (speechSynthesis.onvoiceschanged !== undefined) {
                speechSynthesis.onvoiceschanged = loadSystemVoices;
            }
        }

        // Combo Box 變更事件
        globalVoiceSelect.addEventListener('change', (e) => {
            selectedVoiceUri = e.target.value;
        });

        // 輔助功能：將某一指定卡片搬移至劇場中央
        function moveCardToFocus(cardElement) {
            // 如果中央已有舊卡片，在換新卡前，先將它恢復原本大小並送回網格
            if (lastFocusedCardElement && lastFocusedCardElement !== cardElement) {
                lastFocusedCardElement.classList.remove('playing-now');
                returnCardToOriginalGrid(lastFocusedCardElement);
            }
            focusCardSlot.innerHTML = ""; 
            focusCardSlot.appendChild(cardElement);
            lastFocusedCardElement = cardElement;
        }

        // 輔助功能：將留在劇場中央的卡片送回原網格位置
        function returnAllCardsFromFocus() {
            if (lastFocusedCardElement) {
                lastFocusedCardElement.classList.remove('playing-now');
                returnCardToOriginalGrid(lastFocusedCardElement);
                lastFocusedCardElement = null;
            }
            focusCardSlot.innerHTML = "";
        }

        function returnCardToOriginalGrid(cardElement) {
            const cardId = cardElement.dataset.id;
            const index = rowsData.findIndex(r => r.id === cardId);
            if (index !== -1 && dynamicContainer.children[index]) {
                dynamicContainer.insertBefore(cardElement, dynamicContainer.children[index]);
            } else {
                dynamicContainer.appendChild(cardElement);
            }
        }

        function setupCardSelection(cardDiv, id) {
            cardDiv.addEventListener('click', (e) => {
                if (document.body.classList.contains('focus-mode-active')) return;
                if (e.target.closest('.card-actions') || e.target.classList.contains('delete-btn')) {
                    return; 
                }
                
                document.querySelectorAll('.record-card').forEach(card => {
                    card.classList.remove('selected-card');
                });

                if (selectedCardId === id) {
                    selectedCardId = null;
                } else {
                    selectedCardId = id;
                    cardDiv.classList.add('selected-card');
                }
            });
        }

        // 1. 標準文字語音卡片工廠
        function createRow(initialText = "", initialAudioBase64 = null, savedColorIndex = null) {
            cardSequenceCounter++;
            const rowId = generateId();

            const colorIndex = savedColorIndex !== null ? savedColorIndex : Math.floor(Math.random() * pastelColors.length);
            const chosenColor = pastelColors[colorIndex];

            const rowDataObject = {
                id: rowId,
                type: 'audio_text',
                textValue: initialText,
                audioBase64: initialAudioBase64,
                colorIndex: colorIndex,
                domElement: null,
                playAudioFn: null
            };
            rowsData.push(rowDataObject);

            const cardDiv = document.createElement('div');
            cardDiv.classList.add('record-card');
            cardDiv.draggable = true;
            cardDiv.dataset.id = rowId;
            cardDiv.style.setProperty('--card-accent', chosenColor.main);
            cardDiv.style.setProperty('--card-light-accent', chosenColor.light);
            rowDataObject.domElement = cardDiv;

            bindDragEvents(cardDiv);
            setupCardSelection(cardDiv, rowId);

            let mediaRecorder;
            let audioChunks = [];
            let audioUrl = initialAudioBase64 ? initialAudioBase64 : null;

            const cardHeader = document.createElement('div');
            cardHeader.classList.add('card-header');

            const cardTitle = document.createElement('span');
            cardTitle.classList.add('card-title');
            cardTitle.innerText = `⣿ 記錄卡片 #${cardSequenceCounter}`;

            const deleteBtn = document.createElement('button');
            deleteBtn.type = 'button';
            deleteBtn.classList.add('delete-btn');
            deleteBtn.innerText = '✕';
            deleteBtn.onclick = () => {
                if (selectedCardId === rowId) selectedCardId = null;
                cardDiv.remove();
                rowsData = rowsData.filter(r => r.id !== rowId);
            };

            cardHeader.appendChild(cardTitle);
            cardHeader.appendChild(deleteBtn);

            const inputWrapper = document.createElement('div');
            inputWrapper.classList.add('input-wrapper');

            const textareaInput = document.createElement('textarea');
            textareaInput.classList.add('masked-active');
            textareaInput.value = initialText;
            textareaInput.placeholder = '請輸入機密備忘或隱私文字內容...';
            
            textareaInput.addEventListener('input', (e) => {
                rowDataObject.textValue = e.target.value;
            });

            const toggleBtn = document.createElement('button');
            toggleBtn.type = 'button';
            toggleBtn.classList.add('toggle-btn');
            toggleBtn.innerText = '👁️';
            toggleBtn.onclick = () => {
                if (textareaInput.classList.contains('masked-active')) {
                    textareaInput.classList.remove('masked-active');
                    toggleBtn.innerText = '🔒';
                } else {
                    textareaInput.classList.add('masked-active');
                    toggleBtn.innerText = '👁️';
                }
            };

            inputWrapper.appendChild(textareaInput);
            inputWrapper.appendChild(toggleBtn);

            const cardActions = document.createElement('div');
            cardActions.classList.add('card-actions');

            const recordBtn = document.createElement('button');
            recordBtn.type = 'button';
            recordBtn.classList.add('record-btn');
            recordBtn.innerText = '🎙️ 錄音';

            const playBtn = document.createElement('button');
            playBtn.type = 'button';
            playBtn.classList.add('play-btn');
            playBtn.innerText = '▶️ 播放錄音';
            playBtn.disabled = !audioUrl;

            const ttsBtn = document.createElement('button');
            ttsBtn.type = 'button';
            ttsBtn.classList.add('tts-btn');
            ttsBtn.innerText = '🔊 朗讀文字';

            cardActions.appendChild(recordBtn);
            cardActions.appendChild(playBtn);
            cardActions.appendChild(ttsBtn);

            recordBtn.onclick = async () => {
                if (mediaRecorder && mediaRecorder.state === "recording") {
                    mediaRecorder.stop();
                    recordBtn.innerText = '🎙️ 錄音';
                    recordBtn.classList.remove('recording');
                    return;
                }

                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = (event) => audioChunks.push(event.data);

                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
                        audioUrl = URL.createObjectURL(audioBlob);
                        playBtn.disabled = false;

                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = () => {
                            rowDataObject.audioBase64 = reader.result;
                        };

                        stream.getTracks().forEach(track => track.stop());
                    };

                    mediaRecorder.start();
                    recordBtn.innerText = '🛑 停止';
                    recordBtn.classList.add('recording');
                } catch (err) {
                    alert("麥克風啟動失敗: " + err.message);
                }
            };

            rowDataObject.playAudioFn = () => {
                return new Promise((resolve) => {
                    const targetLoops = Math.max(1, parseInt(globalLoopsInput.value) || 1);
                    const globalWaitSec = Math.max(0, parseInt(globalWaitInput.value) || 0);
                    let currentLoop = 0;

                    const handleLoopDelay = (nextInstanceFn) => {
                        if (!isGlobalPlaying) return resolve(); 
                        currentLoop++;

                        if (currentLoop < targetLoops) {
                            if (globalWaitSec > 0) {
                                currentWaitInterval = setTimeout(nextInstanceFn, globalWaitSec * 1000);
                            } else {
                                nextInstanceFn();
                            }
                        } else {
                            resolve();
                        }
                    };

                    if (audioUrl) {
                        const playInstance = () => {
                            if (!isGlobalPlaying) return resolve();
                            currentActiveAudio = new Audio(audioUrl);
                            currentActiveAudio.onended = () => handleLoopDelay(playInstance);
                            currentActiveAudio.onerror = () => resolve();
                            currentActiveAudio.play().catch(() => resolve());
                        };
                        playInstance();
                    } else {
                        const textToSpeak = textareaInput.value.trim();
                        if (!textToSpeak) {
                            resolve();
                            return;
                        }

                        const playTtsInstance = () => {
                            if (!isGlobalPlaying) return resolve();
                            const utterance = new SpeechSynthesisUtterance(textToSpeak);
                            
                            // 套用 Combo box 選取的語音檔
                            if (selectedVoiceUri) {
                                const matchedVoice = systemVoices.find(v => v.voiceURI === selectedVoiceUri);
                                if (matchedVoice) utterance.voice = matchedVoice;
                            }

                            utterance.onend = () => handleLoopDelay(playTtsInstance);
                            utterance.onerror = () => resolve();

                            window.speechSynthesis.speak(utterance);
                        };
                        playTtsInstance();
                    }
                });
            };

            playBtn.onclick = () => {
                stopAllPlayback(); 
                isGlobalPlaying = true;
                
                document.body.classList.add('focus-mode-active');
                cardDiv.classList.add('playing-now');
                moveCardToFocus(cardDiv);
                
                rowDataObject.playAudioFn().then(() => {
                    returnAllCardsFromFocus();
                    document.body.classList.remove('focus-mode-active');
                    isGlobalPlaying = false;
                });
            };

            ttsBtn.onclick = () => {
                const textToSpeak = textareaInput.value.trim();
                if (!textToSpeak) {
                    alert("文字欄係空嘅，請先輸入內容！");
                    return;
                }
                stopAllPlayback();
                isGlobalPlaying = true;

                document.body.classList.add('focus-mode-active');
                cardDiv.classList.add('playing-now');
                moveCardToFocus(cardDiv);

                const utterance = new SpeechSynthesisUtterance(textToSpeak);
                
                // 套用 Combo box 選取的語音檔
                if (selectedVoiceUri) {
                    const matchedVoice = systemVoices.find(v => v.voiceURI === selectedVoiceUri);
                    if (matchedVoice) utterance.voice = matchedVoice;
                }

                const finishTts = () => {
                    returnAllCardsFromFocus();
                    document.body.classList.remove('focus-mode-active');
                    isGlobalPlaying = false;
                };

                utterance.onend = finishTts;
                utterance.onerror = finishTts;

                window.speechSynthesis.speak(utterance);
            };

            cardDiv.appendChild(cardHeader);
            cardDiv.appendChild(inputWrapper);
            cardDiv.appendChild(cardActions);
            dynamicContainer.appendChild(cardDiv);
        }

        // 2. 新增等待卡片工廠
        function createWaitRow(defaultSeconds = 5) {
            const rowId = generateId();

            const rowDataObject = {
                id: rowId,
                type: 'wait_timer',
                waitSeconds: defaultSeconds,
                domElement: null,
                playAudioFn: null
            };
            rowsData.push(rowDataObject);

            const cardDiv = document.createElement('div');
            cardDiv.classList.add('record-card');
            cardDiv.draggable = true;
            cardDiv.dataset.id = rowId;
            cardDiv.style.setProperty('--card-accent', waitCardColor.main);
            cardDiv.style.setProperty('--card-light-accent', waitCardColor.light);
            rowDataObject.domElement = cardDiv;

            bindDragEvents(cardDiv);
            setupCardSelection(cardDiv, rowId);

            const cardHeader = document.createElement('div');
            cardHeader.classList.add('card-header');

            const cardTitle = document.createElement('span');
            cardTitle.classList.add('card-title');
            cardTitle.innerText = `⣿ ⏳ 等待時間卡`;

            const deleteBtn = document.createElement('button');
            deleteBtn.type = 'button';
            deleteBtn.classList.add('delete-btn');
            deleteBtn.innerText = '✕';
            deleteBtn.onclick = () => {
                if (selectedCardId === rowId) selectedCardId = null;
                cardDiv.remove();
                rowsData = rowsData.filter(r => r.id !== rowId);
            };

            cardHeader.appendChild(cardTitle);
            cardHeader.appendChild(deleteBtn);

            const contentDiv = document.createElement('div');
            contentDiv.classList.add('wait-card-content');

            const clockIcon = document.createElement('div');
            clockIcon.classList.add('wait-card-clock');
            clockIcon.innerText = '⏳';

            const inputGroup = document.createElement('div');
            inputGroup.classList.add('wait-input-group');

            const labelStart = document.createElement('span');
            labelStart.innerText = '暫停等待';

            const secondsInput = document.createElement('input');
            secondsInput.type = 'number';
            secondsInput.min = '1';
            secondsInput.max = '999';
            secondsInput.value = defaultSeconds;
            secondsInput.addEventListener('input', (e) => {
                rowDataObject.waitSeconds = Math.max(1, parseInt(e.target.value) || 1);
            });

            const labelEnd = document.createElement('span');
            labelEnd.innerText = '秒';

            inputGroup.appendChild(labelStart);
            inputGroup.appendChild(secondsInput);
            inputGroup.appendChild(labelEnd);

            contentDiv.appendChild(clockIcon);
            contentDiv.appendChild(inputGroup);

            const cardActions = document.createElement('div');
            cardActions.classList.add('card-actions');

            const testBtn = document.createElement('button');
            testBtn.type = 'button';
            testBtn.classList.add('play-btn');
            testBtn.style.width = '100%';
            testBtn.innerText = '⏱️ 測試等待';

            cardActions.appendChild(testBtn);

            rowDataObject.playAudioFn = () => {
                return new Promise((resolve) => {
                    let remaining = rowDataObject.waitSeconds;
                    testBtn.innerText = `⏳ 等待中 (${remaining}s)`;
                    
                    currentWaitInterval = setInterval(() => {
                        if (!isGlobalPlaying) {
                            clearInterval(currentWaitInterval);
                            testBtn.innerText = '⏱️ 測試等待';
                            return resolve();
                        }
                        remaining--;
                        if (remaining <= 0) {
                            clearInterval(currentWaitInterval);
                            testBtn.innerText = '⏱️ 測試等待';
                            resolve();
                        } else {
                            testBtn.innerText = `⏳ 等待中 (${remaining}s)`;
                        }
                    }, 1000);
                });
            };

            testBtn.onclick = () => {
                stopAllPlayback();
                isGlobalPlaying = true;
                
                document.body.classList.add('focus-mode-active');
                cardDiv.classList.add('playing-now');
                moveCardToFocus(cardDiv);

                rowDataObject.playAudioFn().then(() => {
                    returnAllCardsFromFocus();
                    document.body.classList.remove('focus-mode-active');
                    isGlobalPlaying = false;
                });
            };

            cardDiv.appendChild(cardHeader);
            cardDiv.appendChild(contentDiv);
            cardDiv.appendChild(cardActions);
            dynamicContainer.appendChild(cardDiv);
        }

        // 3. 順序播放全部邏輯
        async function runSequentialPlayAll() {
            if (rowsData.length === 0) return;
            
            stopAllPlayback(); 
            isGlobalPlaying = true;
            playAllBtn.disabled = true;

            document.body.classList.add('focus-mode-active');

            const globalWaitSec = Math.max(0, parseInt(globalWaitInput.value) || 0);

            let startIndex = 0;
            if (selectedCardId) {
                const foundIndex = rowsData.findIndex(r => r.id === selectedCardId);
                if (foundIndex !== -1) {
                    startIndex = foundIndex;
                }
            }

            for (let i = startIndex; i < rowsData.length; i++) {
                if (!isGlobalPlaying) break; 

                const targetRow = rowsData[i];

                targetRow.domElement.classList.add('playing-now');
                moveCardToFocus(targetRow.domElement);

                await targetRow.playAudioFn();

                if (!isGlobalPlaying) break;

                if (globalWaitSec > 0 && i < rowsData.length - 1) {
                    await new Promise((resolve) => {
                        currentWaitInterval = setTimeout(resolve, globalWaitSec * 1000);
                    });
                }
            }

            document.querySelectorAll('.record-card').forEach(card => {
                card.classList.remove('selected-card');
            });
            selectedCardId = null;

            returnAllCardsFromFocus();
            document.body.classList.remove('focus-mode-active');
            playAllBtn.disabled = false;
            isGlobalPlaying = false;
        }

        // 5. 全域停止播放邏輯
        function stopAllPlayback() {
            isGlobalPlaying = false;
            
            if (currentActiveAudio) {
                currentActiveAudio.pause();
                currentActiveAudio = null;
            }

            if (window.speechSynthesis) {
                window.speechSynthesis.cancel();
            }

            clearTimeout(currentWaitInterval);
            clearInterval(currentWaitInterval);

            returnAllCardsFromFocus();
            document.body.classList.remove('focus-mode-active');

            rowsData.forEach(row => {
                if (row.domElement) {
                    row.domElement.classList.remove('playing-now');
                    const btn = row.domElement.querySelector('.card-actions .play-btn');
                    if (row.type === 'wait_timer' && btn) {
                        btn.innerText = '⏱️ 測試等待';
                    }
                }
            });

            playAllBtn.disabled = false;
        }

        stopAllBtn.addEventListener('click', stopAllPlayback);
        focusStopBtn.addEventListener('click', stopAllPlayback);

        // 4. HTML5 原生 Drag and Drop 排序
        let dragSourceElement = null;

        function bindDragEvents(card) {
            card.addEventListener('dragstart', handleDragStart);
            card.addEventListener('dragover', handleDragOver);
            card.addEventListener('drop', handleDrop);
            card.addEventListener('dragend', handleDragEnd);
        }

        function handleDragStart(e) {
            dragSourceElement = this;
            this.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', this.dataset.id);
        }

        function handleDragOver(e) {
            if (e.preventDefault) {
                e.preventDefault(); 
            }
            return false;
        }

        function handleDrop(e) {
            e.stopPropagation();
            e.preventDefault();

            if (dragSourceElement !== this) {
                const allCards = Array.from(dynamicContainer.children);
                const draggedIndex = allCards.indexOf(dragSourceElement);
                const targetIndex = allCards.indexOf(this);

                if (draggedIndex < targetIndex) {
                    dynamicContainer.insertBefore(dragSourceElement, this.nextSibling);
                } else {
                    dynamicContainer.insertBefore(dragSourceElement, this);
                }

                reorderRowsDataArray();
            }
            return false;
        }

        function handleDragEnd() {
            this.classList.remove('dragging');
        }

        function reorderRowsDataArray() {
            const currentDomIds = Array.from(dynamicContainer.children).map(card => card.dataset.id);
            const newRowsData = [];
            
            currentDomIds.forEach(id => {
                const found = rowsData.find(r => r.id === id);
                if (found) newRowsData.push(found);
            });
            
            rowsData = newRowsData;
        }

        function initDragAndDrop() {
            dynamicContainer.addEventListener('dragenter', (e) => e.preventDefault());
            dynamicContainer.addEventListener('dragover', (e) => e.preventDefault());
        }

        function massToggleVisibility(showAll) {
            rowsData.forEach(row => {
                if (row.type === 'audio_text') {
                    const textareaEl = row.domElement.querySelector('textarea');
                    const btnEl = row.domElement.querySelector('.toggle-btn');
                    if (showAll) {
                        textareaEl.classList.remove('masked-active');
                        btnEl.innerText = '🔒';
                    } else {
                        textareaEl.classList.add('masked-active');
                        btnEl.innerText = '👁️';
                    }
                }
            });
        }

        addFieldsBtn.addEventListener('click', () => createRow());
        addWait10Btn.addEventListener('click', () => createWaitRow(10));
        addWait5Btn.addEventListener('click', () => createWaitRow(5));
        playAllBtn.addEventListener('click', runSequentialPlayAll);
        showAllBtn.addEventListener('click', () => massToggleVisibility(true));
        hideAllBtn.addEventListener('click', () => massToggleVisibility(false));

        exportBtn.addEventListener('click', () => {
            if (rowsData.length === 0) return alert("仲未有資料可以匯出！");

            const packageData = {
                settings: {
                    globalLoops: parseInt(globalLoopsInput.value) || 1,
                    globalWait: parseInt(globalWaitInput.value) || 0,
                    selectedVoiceUri: selectedVoiceUri
                },
                items: rowsData.map(item => {
                    if (item.type === 'wait_timer') {
                        return { type: 'wait_timer', waitSeconds: item.waitSeconds };
                    } else {
                        return { type: 'audio_text', text: item.textValue, audio: item.audioBase64, colorIndex: item.colorIndex };
                    }
                })
            };

            const blob = new Blob([JSON.stringify(packageData, null, 2)], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `卡片與等待序列-${new Date().toISOString().slice(0, 10)}.json`;
            link.click();
            URL.revokeObjectURL(url);
        });

        triggerImportBtn.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const importedData = JSON.parse(event.target.result);

                    dynamicContainer.innerHTML = "";
                    rowsData = [];
                    cardSequenceCounter = 0;
                    selectedCardId = null;

                    if (importedData.settings) {
                        globalLoopsInput.value = importedData.settings.globalLoops || 1;
                        globalWaitInput.value = importedData.settings.globalWait || 0;
                        if (importedData.settings.selectedVoiceUri) {
                            selectedVoiceUri = importedData.settings.selectedVoiceUri;
                            if (globalVoiceSelect.querySelector(`option[value="${selectedVoiceUri}"]`)) {
                                globalVoiceSelect.value = selectedVoiceUri;
                            }
                        }
                    }

                    const itemsArray = importedData.items || importedData;
                    if (Array.isArray(itemsArray)) {
                        itemsArray.forEach(item => {
                            if (item.type === 'wait_timer') {
                                createWaitRow(item.waitSeconds || 5);
                            } else {
                                createRow(item.text || "", item.audio || null, item.colorIndex !== undefined ? item.colorIndex : null);
                            }
                        });
                    }
                } catch (err) {
                    alert("匯入失敗，請確保 JSON 檔案格式正確。");
                }
            };
            reader.readAsText(file);
            fileInput.value = "";
        });
    </script>
</body>

</html>
