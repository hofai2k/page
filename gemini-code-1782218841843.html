<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Content Parser & Sender</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f9f9f9;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input[type="url"],
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        textarea {
            height: 250px;
            resize: vertical;
            font-family: monospace;
            font-size: 13px;
        }

        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #0056b3;
        }

        .status {
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h2>URL Content Parser</h2>

    <div class="form-group">
        <label for="urlInput">Enter URL:</label>
        <input type="url" id="urlInput" placeholder="Enter URL here"
            value="https://docs.google.com/spreadsheets/d/10G061q_C2BRpdP_J21JjtSYmZXRlM3Lpoas_K8hMDIA/export?format=csv&gid=0">
        <button id="parseBtn" style="margin-top: 10px;">Parse Button</button>
    </div>

    <div class="form-group">
        <label for="contentArea">URL Content:</label>
        <textarea id="contentArea" placeholder="Parsed content will appear here..."></textarea>
    </div>

    <div class="form-group">
        <button id="startBtn">Start</button>
    </div>

    <div id="statusMessage" class="status"></div>

    <script>
        const urlInput = document.getElementById('urlInput');
        const parseBtn = document.getElementById('parseBtn');
        const contentArea = document.getElementById('contentArea');
        const startBtn = document.getElementById('startBtn');
        const statusMessage = document.getElementById('statusMessage');

        // 1. Parse Button Logic (Optimized for Google Sheets / External URLs)
        parseBtn.addEventListener('click', async () => {
            var targetUrl = urlInput.value.trim();

            if (!targetUrl.startsWith("https://docs.google.com/spreadsheets")) {
                targetUrl = "";
            }


            // /export?format=csv&gid=0
            if (!targetUrl) {
                alert('Please enter a valid URL.');
                return;
            }

            if (targetUrl.endsWith("/")) {
                targetUrl = targetUrl.slice(0, -1);
            }

            if (!targetUrl.endsWith("/")) {
                targetUrl += "/export?format=csv&gid=0";
            }


            statusMessage.style.color = 'blue';
            statusMessage.textContent = 'Fetching content...';
            contentArea.value = '';

            try {
                // Using a reliable open-source proxy alternative to bypass Google's CORS restrictions
                const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`;

                const response = await fetch(proxyUrl);
                if (!response.ok) throw new Error('Network response was not ok.');

                const data = await response.text();

                if (!data || data.includes("<!DOCTYPE html>") && targetUrl.includes("format=csv")) {
                    throw new Error("Google blocked the proxy or sheet is not shared publicly.");
                }

                contentArea.value = data;
                statusMessage.style.color = 'green';
                statusMessage.textContent = 'Content parsed successfully!';
            } catch (error) {
                console.error(error);
                statusMessage.style.color = 'red';
                statusMessage.textContent = 'Failed to fetch. CRITICAL: Make sure your Google Sheet is set to "Anyone with the link can view" or it cannot be parsed!';
            }
        });

        // 2. Start Button Logic (POST textarea data)
        startBtn.addEventListener('click', async () => {
            const textData = contentArea.value;
            if (!textData) {
                alert('There is no content in the textarea to send.');
                return;
            }

            statusMessage.style.color = 'blue';
            statusMessage.textContent = 'Sending data to http://abc.com...';

            try {
                const formData = new URLSearchParams();
                formData.append('content', textData);

                await fetch('http://abc.com', {
                    method: 'POST',
                    mode: 'no-cors', // standard workaround if abc.com lacks cross-origin headers
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: formData.toString()
                });

                statusMessage.style.color = 'green';
                statusMessage.textContent = 'Data sent to http://abc.com!';
            } catch (error) {
                console.error(error);
                statusMessage.style.color = 'orange';
                statusMessage.textContent = 'Request sent. (Note: abc.com response could not be read due to typical browser sandbox rules)';
            }
        });
    </script>

</body>

</html>
