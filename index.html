<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <title>URL Content Parser & Sender</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f9f9f9;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input[type="url"],
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        textarea {
            height: 250px;
            resize: vertical;
            font-family: monospace;
            font-size: 13px;
        }

        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #0056b3;
        }

        .status {
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h2>URL Content Parser</h2>

    <div class="form-group">
        <label for="urlInput">Enter URL:</label>
        <input type="url" id="urlInput" placeholder="Enter URL here"
            value="https://docs.google.com/spreadsheets/d/10G061q_C2BRpdP_J21JjtSYmZXRlM3Lpoas_K8hMDIA">
        <button id="parseBtn" style="margin-top: 10px;">Parse Button</button>
    </div>

    <div class="form-group">
        <label for="contentArea">URL Content:</label>
        <textarea id="contentArea" placeholder="Parsed content will appear here...">
        </textarea>
    </div>

    <div class="form-group">
        <button id="startBtn">Start</button>
    </div>

    <div id="statusMessage" class="status"></div>

    <script>
        const urlInput = document.getElementById('urlInput');
        const parseBtn = document.getElementById('parseBtn');
        const contentArea = document.getElementById('contentArea');
        const startBtn = document.getElementById('startBtn');
        const statusMessage = document.getElementById('statusMessage');

        // 1. Parse Button Logic (Optimized for Google Sheets / External URLs)
        // 1. Parse Button Logic (Optimized for Google Sheets / External URLs)
        parseBtn.addEventListener('click', async () => {
            var targetUrl = urlInput.value.trim();

            if (!targetUrl.startsWith("https://docs.google.com/spreadsheets")) {
                targetUrl = "";
            }

            if (!targetUrl) {
                alert('Please enter a valid URL.');
                return;
            }

            if (targetUrl.endsWith("/")) {
                targetUrl = targetUrl.slice(0, -1);
            }

            targetUrl = targetUrl.replace(/\/edit.*$/, "");

            if (!targetUrl.endsWith("/")) {
                targetUrl += "/export?format=csv&gid=0";
            }

            // --- FIX: Add a unique timestamp parameter to bypass proxy caching ---
            const cacheBuster = `&_t=${Date.now()}`;
            const uniqueTargetUrl = targetUrl + cacheBuster;

            statusMessage.style.color = 'blue';
            statusMessage.textContent = 'Fetching content...';
            contentArea.value = '';

            try {
                // Pass the unique URL to the proxy
                const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(uniqueTargetUrl)}`;

                // --- FIX: Added { cache: "no-store" } to bypass browser caching ---
                const response = await fetch(proxyUrl, { cache: "no-store" });

                if (!response.ok) throw new Error('Network response was not ok.');

                const data = await response.text();

                if (!data || data.includes("<!DOCTYPE html>") && targetUrl.includes("format=csv")) {
                    throw new Error("Google blocked the proxy or sheet is not shared publicly.");
                }

                contentArea.value = data;
                statusMessage.style.color = 'green';
                statusMessage.textContent = 'Content parsed successfully!';
            } catch (error) {
                console.error(error);
                statusMessage.style.color = 'red';
                statusMessage.textContent = 'Failed to fetch. CRITICAL: Make sure your Google Sheet is set to "Anyone with the link can view" or it cannot be parsed!';
            }
        });
        // 2. Start Button Logic (POST textarea data)
        // 2. Start Button Logic (Forward data via URL query parameter)
        startBtn.addEventListener('click', () => {
            const textData = contentArea.value.trim();
            if (!textData) {
                alert('There is no content in the textarea to send.');
                return;
            }

            statusMessage.style.color = 'blue';
            statusMessage.textContent = 'Forwarding to game...';

            // Base URL of your game
            const targetPage = 'https://hofai2k.github.io/page/sentence_game_1.html';

            // Safely encode the CSV/text data for a URL parameter
            const encodedData = encodeURIComponent(textData);

            // Construct the final URL with the 'content' parameter
            const finalUrl = `${targetPage}?content=${encodedData}`;

            // Redirect the user to the game page
            window.location.href = finalUrl;
        });


    </script>

</body>

</html>
