<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280, initial-scale=1.0">
    <title>句子遊戲 (雙人對戰)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght=500;700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        @font-face {
            font-family: 'b8AR4';
            src: url('fonts/kaiu.woff2') format('woff2'),
                url('fonts/kaiu.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        :root {
            --bg-image: url('Gemini_Generated_Image_2g1m8a2g1m8a2g1m.png');
        }

        body {
            font-family: 'b8AR4', sans-serif;
            background-image: var(--bg-image);
            background-color: #5c8f24;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: auto;
            /* 允許小螢幕滾動，不破壞排版 */
            padding: 15px;
        }

        .arcade-border {
            border: 8px solid #4a3525;
            box-shadow: 0 10px 0 #2d2016;
        }

        .grid-border {
            border: 6px solid #4a3525;
        }

        .panel-border {
            border: 4px solid #4a3525;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .preview-panel {
            transition: all 0.3s ease;
        }

        .retro-glow {
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
        }
    </style>
</head>

<body class="p-4">

    <div
        class="game-container w-full max-w-[1400px] min-w-[1100px] bg-[#fffaf0]/50 arcade-border rounded-3xl relative flex flex-row p-8 gap-8 min-h-[640px]">

        <div
            class="absolute -top-6 left-12 bg-[#ff7875] border-4 border-[#4a3525] px-8 py-2 rounded-2xl shadow-[0_5px_0_#4a3525] z-30">
            <span class="text-white font-black text-3xl tracking-wider text-center block">句子遊戲</span>
        </div>

        <div id="player-1-section"
            class="preview-panel flex-1 flex flex-col justify-between items-center pt-12 pb-4 relative h-auto border-r-4 border-dashed border-[#ecd5c3]">
            <div
                class="relative w-48 h-48 bg-black border-4 border-[#4a3525] rounded-full overflow-hidden flex flex-col items-center justify-center shadow-xl group">
                <video id="camera-stream" autoplay playsinline class="w-full h-full object-cover"></video>
                <canvas id="photo-canvas" class="hidden"></canvas>
                <img id="photo-preview" class="absolute inset-0 w-full h-full object-cover hidden"
                    alt="Captured avatar" />
                <button onclick="retakePhoto(1)" id="retake-btn"
                    class="absolute bottom-2 bg-black/70 text-white text-[10px] px-2 py-0.5 rounded hidden hover:bg-black">重拍</button>
            </div>
            <div
                class="char-tag bg-[#ff4d4f] border-3 border-[#4a3525] text-white text-center py-2 px-8 rounded-2xl shadow-[0_4px_0_#4a3525] mt-4 mb-4">
                <span id="char-name" class="font-black text-xl">玩家 1</span>
            </div>
            <div class="flex gap-2">
                <button onclick="takePhoto(1)" id="capture-btn"
                    class="bg-gradient-to-r from-emerald-500 to-teal-500 border-3 border-[#4a3525] text-white py-2 px-5 rounded-full font-black shadow-[0_3px_0_#4a3525] active:translate-y-1 active:shadow-none transition-all">
                    📸 拍照
                </button>
            </div>
        </div>

        <div id="main-section"
            class="menu-section flex-[1.6] bg-black/5 backdrop-blur-sm panel-border rounded-2xl p-4 flex flex-col relative overflow-hidden">

            <div id="waiting-overlay"
                class="absolute inset-0 bg-black/90 z-20 flex flex-col items-center justify-center p-4 text-center">
                <h2 class="text-white text-3xl font-black mb-4 tracking-wide">等待雙方拍照以開始遊戲</h2>
                <p class="text-yellow-400 text-sm font-bold mb-6">💡 拍照時將同時啟動對應玩家的 8-bit BGM 音樂！</p>
                <div class="flex gap-4">
                    <span id="p1-status"
                        class="bg-red-500 border-2 border-white/50 text-white px-4 py-2 rounded-xl font-black shadow-lg">玩家
                        1: 未準備</span>
                    <span id="p2-status"
                        class="bg-orange-500 border-2 border-white/50 text-white px-4 py-2 rounded-xl font-black shadow-lg">玩家
                        2: 未準備</span>
                </div>
            </div>

            <div id="category-title" class="text-[#4a3525] text-xl font-black mb-2 flex justify-between items-center">
                <span>正在載入關卡...</span>
                <span id="turn-indicator"
                    class="text-red-600 bg-red-100 px-3 py-1 rounded-lg text-sm border-2 border-red-300 hidden">換玩家 1
                    挑戰</span>
            </div>

            <div
                class="grid-panel flex-1 bg-[#73d13d] grid-border rounded-xl p-3 grid grid-cols-3 gap-3 overflow-y-auto no-scrollbar">
            </div>

            <div
                class="info-banner bg-black/80 border-2 border-white/20 rounded-xl p-3 text-white mt-3 flex flex-col items-center min-h-[80px]">
                <div class="text-[#73d13d] font-black text-sm mb-1">你的句子：</div>
                <div id="answer-zone" class="flex flex-wrap gap-2 justify-center items-center p-2"></div>
            </div>

            <div class="flex justify-between mt-3 gap-2">
                <button onclick="giveHint()"
                    class="bg-gradient-to-r from-purple-500 to-indigo-500 border-3 border-[#4a3525] text-white py-2 px-4 rounded-xl font-black shadow-[0_3px_0_#4a3525] active:translate-y-1 active:shadow-none transition-transform">提示</button>
                <button onclick="resetAnswer()"
                    class="bg-[#4a3525] text-white py-2 px-4 rounded-xl font-black shadow-[0_3px_0_#21150e] active:translate-y-1 active:shadow-none transition-transform">重新排列</button>
                <button onclick="checkAnswer()"
                    class="flex-1 bg-yellow-400 text-[#4a3525] border-3 border-[#4a3525] rounded-xl font-black shadow-[0_4px_0_#4a3525] active:translate-y-1 active:shadow-none transition-all">送出答案</button>
            </div>
        </div>

        <div id="player-2-section"
            class="preview-panel flex-1 flex flex-col justify-between items-center pt-12 pb-4 relative h-auto border-l-4 border-dashed border-[#ecd5c3]">
            <div
                class="relative w-48 h-48 bg-black border-4 border-[#4a3525] rounded-full overflow-hidden flex flex-col items-center justify-center shadow-xl group">
                <video id="camera-stream-2" autoplay playsinline class="w-full h-full object-cover"></video>
                <canvas id="photo-canvas-2" class="hidden"></canvas>
                <img id="photo-preview-2" class="absolute inset-0 w-full h-full object-cover hidden"
                    alt="Captured avatar" />
                <button onclick="retakePhoto(2)" id="retake-btn-2"
                    class="absolute bottom-2 bg-black/70 text-white text-[10px] px-2 py-0.5 rounded hidden hover:bg-black">重拍</button>
            </div>
            <div
                class="char-tag bg-[#ffb969] border-3 border-[#4a3525] text-white text-center py-2 px-8 rounded-2xl shadow-[0_4px_0_#4a3525] mt-4 mb-4">
                <span id="char-name-2" class="font-black text-xl">玩家 2</span>
            </div>
            <div class="flex gap-2">
                <button onclick="takePhoto(2)" id="capture-btn-2"
                    class="bg-gradient-to-r from-amber-500 to-orange-500 border-3 border-[#4a3525] text-white py-2 px-5 rounded-full font-black shadow-[0_3px_0_#4a3525] active:translate-y-1 active:shadow-none transition-all">
                    📸 拍照
                </button>
            </div>
        </div>

    </div>

    <div id="game-modal"
        class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div
            class="bg-[#fffaf0] border-8 border-[#4a3525] rounded-3xl p-6 max-w-md w-full text-center relative shadow-[0_10px_0_#2d2016] overflow-hidden flex flex-col items-center justify-center min-h-[240px]">
            <div class="relative z-10 flex flex-col items-center gap-4 w-full">
                <div class="bg-[#ff7875] border-4 border-[#4a3525] px-6 py-1 rounded-xl shadow-[0_4px_0_#4a3525]">
                    <span class="text-white font-black text-lg tracking-wider">提示訊息</span>
                </div>
                <p id="modal-message" class="text-[#4a3525] text-xl font-black my-2 leading-relaxed px-2"></p>
                <button onclick="closeModal()"
                    class="bg-yellow-400 text-[#4a3525] border-3 border-[#4a3525] rounded-xl font-black py-2 px-8 shadow-[0_4px_0_#4a3525] hover:bg-yellow-300 active:translate-y-0.5 active:shadow-[0_2px_0_#4a3525] transition-all">
                    確定
                </button>
            </div>
        </div>
    </div>

    <script>
        let levels = [];
        let currentLevelIndex = 0;
        let availableWords = [];
        let selectedWords = [];

        let p1Ready = false;
        let p2Ready = false;
        let gameStarted = false;
        let currentPlayer = 1;

        let matchHistory = [];
        let modalActiveCallback = null;

        function parseToLevels(text) {
            const blocks = text.split(/---+/);
            const loadedLevels = [];

            for (const block of blocks) {
                const trimmedBlock = block.trim();
                if (!trimmedBlock) continue;

                const levelObj = { targets: [] };
                const lines = trimmedBlock.split('\n');

                for (let line of lines) {
                    line = line.trim();
                    if (!line) continue;

                    const colonIndex = line.indexOf(':');
                    if (colonIndex === -1) continue;

                    const key = line.substring(0, colonIndex).trim();
                    var value = line.substring(colonIndex + 1).trim();

                    if (key === 'title') {
                        levelObj.title = value.replace(/"$/, '');
                    } else if (key === 'target') {
                        value = ' '.join(text.split());
                        levelObj.words = value.split(' ').sort(() => Math.random() - 0.5);
                        levelObj.targets.push(value);
                    }
                }

                if (Object.keys(levelObj).length > 1) {
                    loadedLevels.push(levelObj);
                }
            }
            return loadedLevels;
        }

        async function loadGameLevels() {
            const urlParams = new URLSearchParams(window.location.search);
            try {
                const textData = `sentence_game_1/${urlParams.get('content')}`;
                console.log(textData);

                levels = parseToLevels(textData);

                if (levels.length > 0) {
                    initLevel(0);
                } else {
                    document.getElementById('category-title').firstElementChild.textContent = "錯誤：沒找到有效關卡資料";
                }
            } catch (error) {
                console.error("載入設定檔時發生錯誤:", error);
                document.getElementById('category-title').firstElementChild.textContent = "讀取關卡失敗，請檢查文字檔是否存在。";
            }
        }

        const AudioManager = {
            initialized: false,
            bgmSynth: null,
            sfxSynth: null,
            currentBgmSequence: null,
            activeTrack: null,

            async init() {
                if (this.initialized) return;
                await Tone.start();

                this.bgmSynth = new Tone.PolySynth(Tone.Synth, {
                    oscillator: { type: "square" },
                    envelope: { attack: 0.02, decay: 0.1, sustain: 0.2, release: 0.1 }
                }).toDestination();
                this.bgmSynth.volume.value = -14;

                this.sfxSynth = new Tone.Synth({
                    oscillator: { type: "square" },
                    envelope: { attack: 0.01, decay: 0.08, sustain: 0, release: 0.08 }
                }).toDestination();
                this.sfxSynth.volume.value = -6;

                Tone.Transport.bpm.value = 160;
                this.initialized = true;
            },

            playTrack(trackName) {
                if (!this.initialized) return;
                if (this.activeTrack === trackName) return;

                this.stopBGM();
                this.activeTrack = trackName;

                let melodyNotes = [];

                if (trackName === 'p1') {
                    Tone.Transport.bpm.value = 110;
                    melodyNotes = [
                        "C4", "E4", "G4", "A4", "G4", "E4", "D4", null,
                        "C4", "E4", "G4", "A4", "C5", "A4", "G4", null,
                        "A4", "C5", "E5", "D5", "C5", "A4", "G4", null,
                        "F4", "A4", "C5", "A4", "G4", "E4", "D4", "C4"
                    ];
                } else if (trackName === 'p2') {
                    Tone.Transport.bpm.value = 110;
                    melodyNotes = [
                        "F3", "A3", "C4", "E4", "D4", null, "C4", null,
                        "G3", "B3", "D4", "F4", "E4", null, "D4", null,
                        "E3", "G3", "B3", "D4", "C4", null, "A3", null,
                        "A3", "C4", "E4", "G4", "F4", "E4", "D4", "C4"
                    ];
                } else if (trackName === 'summary') {
                    Tone.Transport.bpm.value = 110;
                    melodyNotes = [
                        "C4", "E4", "G4", "C5", "E5", "G5", "C6", null,
                        "F4", "A4", "C5", "F5", "A5", "C6", "F6", null,
                        "G4", "B4", "D5", "G5", "B5", "D6", "G6", null,
                        "C5", "E5", "G5", "C6", null, null, null, null
                    ];
                }

                this.currentBgmSequence = new Tone.Sequence((time, note) => {
                    if (note) {
                        this.bgmSynth.triggerAttackRelease(note, "8n", time);
                    }
                }, melodyNotes, "8n");

                this.currentBgmSequence.loop = true;
                this.currentBgmSequence.start(0);

                if (Tone.Transport.state !== "started") {
                    Tone.Transport.start();
                }
            },

            stopBGM() {
                if (this.currentBgmSequence) {
                    this.currentBgmSequence.stop();
                    this.currentBgmSequence.dispose();
                    this.currentBgmSequence = null;
                }
                this.activeTrack = null;
            },

            playClick() {
                if (!this.initialized) return;
                this.sfxSynth.triggerAttackRelease("E6", "32n");
            },

            playCorrect() {
                if (!this.initialized) return;
                const now = Tone.now();
                this.sfxSynth.triggerAttackRelease("C5", "16n", now);
                this.sfxSynth.triggerAttackRelease("E5", "16n", now + 0.08);
                this.sfxSynth.triggerAttackRelease("G5", "16n", now + 0.16);
                this.sfxSynth.triggerAttackRelease("C6", "8n", now + 0.24);
            },

            playWrong() {
                if (!this.initialized) return;
                const now = Tone.now();
                this.sfxSynth.triggerAttackRelease("B3", "8n", now);
                this.sfxSynth.triggerAttackRelease("F3", "4n", now + 0.12);
            }
        };

        const getCamElements = (id) => ({
            video: document.getElementById(id === 1 ? 'camera-stream' : 'camera-stream-2'),
            canvas: document.getElementById(id === 1 ? 'photo-canvas' : 'photo-canvas-2'),
            preview: document.getElementById(id === 1 ? 'photo-preview' : 'photo-preview-2'),
            captureBtn: document.getElementById(id === 1 ? 'capture-btn' : 'capture-btn-2'),
            retakeBtn: document.getElementById(id === 1 ? 'retake-btn' : 'retake-btn-2')
        });

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 400, height: 400, facingMode: "user" },
                    audio: false
                });
                getCamElements(1).video.srcObject = stream;
                getCamElements(2).video.srcObject = stream;
            } catch (err) {
                console.error("相機存取失敗 / Camera denied: ", err);
            }
        }

        async function takePhoto(camId) {
            await AudioManager.init();
            AudioManager.playClick();

            const cam = getCamElements(camId);
            cam.canvas.width = cam.video.videoWidth || 400;
            cam.canvas.height = cam.video.videoHeight || 400;

            const context = cam.canvas.getContext('2d');
            context.drawImage(cam.video, 0, 0, cam.canvas.width, cam.canvas.height);

            cam.preview.src = cam.canvas.toDataURL('image/png');
            cam.preview.classList.remove('hidden');
            cam.retakeBtn.classList.remove('hidden');
            cam.captureBtn.innerHTML = "🔄 重拍";

            if (camId === 1) {
                p1Ready = true;
                const status = document.getElementById('p1-status');
                status.textContent = "玩家 1: OK!";
                status.classList.replace('bg-red-500', 'bg-green-500');
            } else {
                p2Ready = true;
                const status = document.getElementById('p2-status');
                status.textContent = "玩家 2: OK!";
                status.classList.replace('bg-orange-500', 'bg-green-500');
            }
            checkGameStart();
        }

        function retakePhoto(camId) {
            AudioManager.playClick();
            const cam = getCamElements(camId);
            cam.preview.classList.add('hidden');
            cam.retakeBtn.classList.add('hidden');
            cam.captureBtn.innerHTML = "📸 拍照";

            if (!gameStarted) {
                if (camId === 1) {
                    p1Ready = false;
                    const status = document.getElementById('p1-status');
                    status.textContent = "玩家 1: 未準備";
                    status.classList.replace('bg-green-500', 'bg-red-500');
                } else {
                    p2Ready = false;
                    const status = document.getElementById('p2-status');
                    status.textContent = "玩家 2: 未準備";
                    status.classList.replace('bg-green-500', 'bg-orange-500');
                }
            }
        }

        function checkGameStart() {
            if (p1Ready && p2Ready && !gameStarted) {
                setTimeout(() => {
                    gameStarted = true;
                    document.getElementById('waiting-overlay').classList.add('hidden');
                    document.getElementById('turn-indicator').classList.remove('hidden');
                    switchTurn(1);
                }, 800);
            }
        }

        // 修改 switchTurn：在桌面比例鎖定下，保持兩側區塊不消失，改用不透明度 (opacity) 或視覺提示代表當前玩家
        function switchTurn(playerNum) {
            currentPlayer = playerNum;
            const p1Section = document.getElementById('player-1-section');
            const p2Section = document.getElementById('player-2-section');
            const turnIndicator = document.getElementById('turn-indicator');

            if (playerNum === 1) {
                p1Section.style.opacity = '1';
                p2Section.style.opacity = '0.3'; // 未輪到的玩家半透明，但位置不變
                turnIndicator.textContent = '換玩家 1 挑戰';
                turnIndicator.className = "text-red-600 bg-red-100 px-3 py-1 rounded-lg text-sm border-2 border-red-300 font-black";
                AudioManager.playTrack('p1');
            } else {
                p1Section.style.opacity = '0.3'; // 未輪到的玩家半透明，但位置不變
                p2Section.style.opacity = '1';
                turnIndicator.textContent = '換玩家 2 挑戰';
                turnIndicator.className = "text-orange-600 bg-orange-100 px-3 py-1 rounded-lg text-sm border-2 border-orange-300 font-black";
                AudioManager.playTrack('p2');
            }
        }

        function showModal(message, callback = null) {
            if (AudioManager.bgmSynth) {
                AudioManager.bgmSynth.volume.value = -24;
            }
            document.getElementById('modal-message').textContent = message;
            modalActiveCallback = callback;
            document.getElementById('game-modal').classList.remove('hidden');
        }

        function closeModal() {
            AudioManager.playClick();
            document.getElementById('game-modal').classList.add('hidden');

            if (AudioManager.bgmSynth) {
                AudioManager.bgmSynth.volume.value = -14;
            }

            if (modalActiveCallback) {
                const executeCallback = modalActiveCallback;
                modalActiveCallback = null;
                executeCallback();
            }
        }

        function initLevel(index) {
            if (!levels || levels.length === 0) return;
            currentLevelIndex = index;
            availableWords = [...levels[index].words].sort(() => Math.random() - 0.5);
            selectedWords = [];
            document.getElementById('category-title').firstElementChild.textContent = levels[index].title;
            renderGrid();
        }

        function renderGrid() {
            const grid = document.querySelector('.grid-panel');
            grid.innerHTML = '';
            availableWords.forEach((word, idx) => {
                const card = document.createElement('div');
                card.className = "bg-white border-4 border-[#73d13d] rounded-xl h-[80px] flex items-center justify-center font-black text-2xl cursor-pointer shadow-sm hover:-translate-y-1 hover:shadow-[0_4px_0_#4a3525] active:translate-y-0 active:shadow-none transition-all";
                card.textContent = word;
                card.onclick = () => {
                    AudioManager.playClick();
                    selectedWords.push(availableWords.splice(idx, 1)[0]);
                    renderGrid();
                };
                grid.appendChild(card);
            });
            const zone = document.getElementById('answer-zone');
            zone.innerHTML = '';
            selectedWords.forEach((word, idx) => {
                const badge = document.createElement('div');
                badge.className = "bg-yellow-300 text-[#4a3525] border-2 border-[#4a3525] px-4 py-2 rounded-lg cursor-pointer font-black text-2xl shadow-sm hover:-translate-y-1 transition-transform";
                badge.textContent = word;
                badge.onclick = () => {
                    AudioManager.playClick();
                    availableWords.push(selectedWords.splice(idx, 1)[0]);
                    renderGrid();
                };
                zone.appendChild(badge);
            });
        }

        function resetAnswer() {
            if (!gameStarted) return;
            AudioManager.playClick();
            availableWords = availableWords.concat(selectedWords);
            selectedWords = [];
            renderGrid();
        }

        function giveHint() {
            if (!gameStarted) return;
            AudioManager.playClick();
            showModal("提示：第一個字是 " + levels[currentLevelIndex].targets[0].split(" ")[0]);
        }

        function checkAnswer() {
            if (!gameStarted) return;

            const userAnswer = selectedWords.join(" ");

            if (levels[currentLevelIndex].targets.includes(userAnswer)) {
                AudioManager.playCorrect();

                if (currentPlayer === 1) {
                    matchHistory[currentLevelIndex] = { title: levels[currentLevelIndex].title, p1: userAnswer };
                    showModal("🎉 玩家 1 答對了！換玩家 2 挑戰！", () => {
                        switchTurn(2);
                        initLevel(currentLevelIndex);
                    });
                } else {
                    matchHistory[currentLevelIndex].p2 = userAnswer;
                    if (currentLevelIndex < levels.length - 1) {
                        showModal("🎉 玩家 2 也答對了！進入下一關，換回玩家 1！", () => {
                            switchTurn(1);
                            initLevel(currentLevelIndex + 1);
                        });
                    } else {
                        showModal("🏆 恭喜！雙方都完成了所有關卡！", () => {
                            showReviewPage();
                        });
                    }
                }
            } else {
                AudioManager.playWrong();
                showModal("❌ 錯誤，請再試試看！");
            }
        }

        function showReviewPage() {
            AudioManager.playTrack('summary');
            const container = document.querySelector('.game-container');

            let reviewHtml = `<div class="w-full h-full bg-[#fffaf0]/95 backdrop-blur-md rounded-2xl p-6 md:p-8 flex flex-col z-40 absolute inset-0 overflow-y-auto border-4 border-[#4a3525] shadow-2xl">
                <h1 class="text-3xl font-black text-center mb-6 text-[#4a3525] retro-glow">📜 遊戲回顧</h1>`;

            matchHistory.forEach((match, i) => {
                const validAnswers = levels[i].targets.join(" / ");
                reviewHtml += `
                <div class="mb-4 p-4 border-2 border-dashed border-[#4a3525] rounded-xl bg-white shadow-sm">
                    <h2 class="text-xl font-black text-[#4a3525] mb-2">${match.title}</h2>
                    <p class="text-sm text-gray-600 mb-3 font-bold">✅ 允許的答案: <span class="text-green-600">${validAnswers}</span></p>
                    <div class="flex flex-row gap-4">
                        <div class="flex-1 bg-red-100 p-3 rounded-lg border-2 border-red-300">
                            <span class="font-black text-red-600 block mb-1">玩家 1 答案:</span>
                            <span class="font-bold text-gray-800">${match.p1}</span>
                        </div>
                        <div class="flex-1 bg-orange-100 p-3 rounded-lg border-2 border-orange-300">
                            <span class="font-black text-orange-600 block mb-1">玩家 2 答案:</span>
                            <span class="font-bold text-gray-800">${match.p2}</span>
                        </div>
                    </div>
                </div>`;
            });

            reviewHtml += `<button onclick="location.reload()" class="mt-6 bg-[#4a3525] text-white py-3 px-6 rounded-xl font-black text-lg shadow-[0_4px_0_#2d2016] hover:bg-[#5c4331] active:translate-y-1 active:shadow-none transition-all self-center w-64">🔄 再來一局</button></div>`;

            container.innerHTML += reviewHtml;
        }

        window.onload = () => {
            loadGameLevels();
            initCamera();
        };
    </script>
</body>

</html>
